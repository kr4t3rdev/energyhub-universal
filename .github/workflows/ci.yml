name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum}
      - run: go test ./...
      - run: go build ./...
      # The tenant isolation and the administrative boundary are only proven
      # against a real PostgreSQL, so the integration suite runs in CI too.
      - name: PostgreSQL integration tests
        run: go test ./internal/storage/postgres -run TestIntegration -v
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.0.8}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project apps/ios/EnergyHub.xcodeproj -scheme EnergyHub -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/android}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
