openapi: 3.1.0
info:
  title: EnergyHub Universal API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: API process is running (does not assert database readiness)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
