services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: energyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: energyhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energyhub -d energyhub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
