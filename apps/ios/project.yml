name: EnergyHub
options:
  bundleIdPrefix: com.energyhub
  deploymentTarget:
    iOS: "17.0"
packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: 3.3.0
targets:
  EnergyHub:
    type: application
    platform: iOS
    sources: [EnergyHub]
    dependencies:
      - package: Auth0
        product: Auth0
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.energyhub.universal
        SWIFT_VERSION: "5.0"
    info:
      path: EnergyHub/Info.plist
      properties:
        APIBaseURL: https://api.energyhub.kr4t3rdev.xyz
        Auth0Domain: dev-4nf302ypyiy2lxjl.us.auth0.com
        Auth0ClientId: WJxReSDAoczppyhvyFEK0YZH6s8ZpE6q
        Auth0Audience: https://api.energyhub.kr4t3rdev.xyz
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.energyhub.universal
  EnergyHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EnergyHubTests]
    dependencies:
      - target: EnergyHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.energyhub.universal.tests
schemes:
  EnergyHub:
    build:
      targets:
        EnergyHub: all
        EnergyHubTests: [test]
    test:
      targets: [EnergyHubTests]
